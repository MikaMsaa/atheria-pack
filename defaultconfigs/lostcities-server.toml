#General settings
[profiles]
	#Block to put underneath a bed so that it qualifies as a teleporter bed
	specialBedBlock = "minecraft:diamond_block"
	selectedProfile = "atheria"
	selectedCustomJson = ""
	#The size of the todo queues for the lost city generator
	# Default: 20
	# Range: 1 ~ 100000
	todoQueueSize = 20
	#If this is true then saplings will grow into trees during generation. This is more expensive
	forceSaplingGrowth = true
	#Time in seconds after which cached chunk data is evicted
	# Default: 300
	# Range: 1 ~ 86400
	cacheCleanupSeconds = 300
	#List of structures to avoid when generating cities (for example to avoid generating a city in a woodland mansion)
	avoidStructures = ["minecraft:mansion", "minecraft:jungle_pyramid", "minecraft:desert_pyramid", "minecraft:igloo", "minecraft:swamp_huts", "minecraft:pillager_outpost", "repurposed_structures:mansion_birch", "repurposed_structures:mansion_desert", "repurposed_structures:mansion_jungle", "repurposed_structures:mansion_mangrove", "repurposed_structures:mansion_oak", "repurposed_structures:mansion_savanna", "repurposed_structures:mansion_snowy", "repurposed_structures:mansion_taiga", "repurposed_structures:pyramid_badlands", "repurposed_structures:pyramid_dark_forest", "repurposed_structures:pyramid_flower_forest", "repurposed_structures:pyramid_giant_tree_taiga", "repurposed_structures:pyramid_icy", "repurposed_structures:pyramid_jungle", "repurposed_structures:pyramid_mushroom", "repurposed_structures:pyramid_snowy", "repurposed_structures:outpost_badlands", "repurposed_structures:outpost_birch", "repurposed_structures:outpost_desert", "repurposed_structures:outpost_giant_tree_taiga", "repurposed_structures:outpost_icy", "repurposed_structures:outpost_jungle", "repurposed_structures:outpost_mangrove", "repurposed_structures:outpost_oak", "repurposed_structures:outpost_savanna", "repurposed_structures:outpost_snowy", "repurposed_structures:outpost_taiga", "repurposed_structures:village_badlands", "repurposed_structures:village_bamboo", "repurposed_structures:village_birch", "repurposed_structures:village_cherry", "repurposed_structures:village_dark_forest", "repurposed_structures:village_giant_taiga", "repurposed_structures:village_jungle", "repurposed_structures:village_mountains", "repurposed_structures:village_mushroom", "repurposed_structures:village_oak", "repurposed_structures:village_swamp", "repurposed_structures:temple_taiga", "repurposed_structures:fortress_jungle", "repurposed_structures:city_overworld", "explorify:badlands_pyramid", "spore:lab", "spore:military_camp", "spore:biomass_tower", "create_fallout:broadcast_station", "create_fallout:red_rocket_station", "postapocalypse_structures:red_mansion", "structory_towers:ancient_temple", "structory_towers:sacred_relic_temple", "structory_towers:wizard_tower", "structory_towers:engineer_tower", "structory_towers:lighthouse"]
	#If true then also avoid generating the structures mentioned in 'avoidStructures' in chunks adjacent to the chunk with the structure
	avoidStructuresAdjacent = true
	#If true then also avoid generating cities in chunks adjacent to the chunks with villages
	avoidVillagesAdjacent = false
	#If true then avoid generating cities in chunks with villages
	avoidVillages = true
	#If true then avoid flattening the terrain around the city in case there was a structure that was avoided
	avoidFlattening = true
